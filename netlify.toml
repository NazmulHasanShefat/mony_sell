[[redirects]]
  from = "/api/auth/*"
  to = "https://mony-sell-backend.vercel.app/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  [build]
  command = "sed -i 's|BACKEND_URL_PLACEHOLDER|dummy|g' netlify.toml && npm run build"
  publish = "dist"